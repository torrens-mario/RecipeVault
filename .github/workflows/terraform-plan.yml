name: Terraform Plan

# Se ejecuta en cada Pull Request que toque archivos de Terraform o de la app
on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform-appservice/**'
      - 'terraform-state-bootstrap/**'
      - 'app/**'

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: terraform-appservice
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform-appservice
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform-appservice
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform-appservice
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true  # El plan puede fallar si hay cambios destructivos; queremos verlo igualmente

      - name: Publicar plan como comentario en el PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { execSync } = require('child_process');
            let plan;
            try {
              plan = execSync('terraform show -no-color tfplan', {
                cwd: 'terraform-appservice',
                maxBuffer: 1024 * 1024
              }).toString();
            } catch (e) {
              plan = 'No se pudo obtener el plan.';
            }
            const MAX = 65000;
            const body = plan.length > MAX
              ? plan.substring(0, MAX) + '\n\n... (plan truncado por longitud)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan\n\`\`\`terraform\n${body}\n\`\`\``
            });
