name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform-appservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform-appservice/**'

# OIDC requiere permiso para solicitar el token de identidad
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Evita aplicaciones paralelas del mismo estado de Terraform
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-appservice

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (Managed Identity — OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="use_azuread_auth=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true  # mostramos el plan aunque haya cambios destructivos

      - name: Comentar plan en el PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { execSync } = require('child_process');
            let plan;
            try {
              plan = execSync('terraform show -no-color tfplan', {
                cwd: 'terraform-appservice',
                maxBuffer: 1024 * 1024
              }).toString();
            } catch (e) {
              plan = 'No se pudo obtener el plan.';
            }
            const MAX = 65000;
            const body = plan.length > MAX
              ? plan.substring(0, MAX) + '\n\n... (plan truncado por longitud)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`terraform\n${body}\n\`\`\``
            });

      - name: Verificar resultado del plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -no-color tfplan

      - name: Resumen
        if: github.event_name == 'push' && always()
        run: |
          echo "### Infraestructura aplicada" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Service:** $(terraform output -raw app_service_name 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $(terraform output -raw backend_url 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **MI Client ID:** $(terraform output -raw managed_identity_client_id 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
