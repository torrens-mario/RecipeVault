name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform-appservice/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform-appservice/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Accion de Terraform'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
  workflow_call:
    inputs:
      action:
        description: 'Accion de Terraform'
        required: true
        type: string
        default: apply

# OIDC requiere permiso para solicitar el token de identidad
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Evita aplicaciones paralelas del mismo estado de Terraform
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: >-
      Terraform
      ${{ github.event_name == 'pull_request' && 'Plan (PR)' ||
          github.event_name == 'workflow_dispatch' && inputs.action ||
          'Apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-appservice

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (Managed Identity — OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # ── Plan ────────────────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        if: |
          github.event_name == 'pull_request' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'plan') ||
          (github.event_name == 'workflow_call' && inputs.action == 'plan')
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comentar plan en el PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { execSync } = require('child_process');
            let plan;
            try {
              plan = execSync('terraform show -no-color tfplan', {
                cwd: 'terraform-appservice',
                maxBuffer: 1024 * 1024
              }).toString();
            } catch (e) {
              plan = 'No se pudo obtener el plan.';
            }
            const MAX = 65000;
            const body = plan.length > MAX
              ? plan.substring(0, MAX) + '\n\n... (plan truncado por longitud)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`terraform\n${body}\n\`\`\``
            });

      - name: Verificar resultado del plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── Apply ───────────────────────────────────────────────────────────────
      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') ||
          (github.event_name == 'workflow_call' && inputs.action == 'apply')
        run: |
          if [ -f tfplan ]; then
            terraform apply -auto-approve -no-color tfplan
          else
            terraform apply -auto-approve -no-color
          fi

      # ── Destroy ─────────────────────────────────────────────────────────────
      - name: Terraform Destroy
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.action == 'destroy') ||
          (github.event_name == 'workflow_call' && inputs.action == 'destroy')
        run: terraform destroy -auto-approve -no-color

      # ── Resumen ─────────────────────────────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          echo "### Terraform — ${{ github.event_name == 'workflow_dispatch' && inputs.action || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Service:** $(terraform output -raw app_service_name 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $(terraform output -raw backend_url 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de datos:** $(terraform output -raw db_server_fqdn 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **Key Vault:** $(terraform output -raw key_vault_uri 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **Storage:** $(terraform output -raw storage_account_name 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
