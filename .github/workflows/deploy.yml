name: Deploy a Azure

# Se ejecuta solo cuando se hace merge (push) a main
on:
  push:
    branches:
      - main

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  RESOURCE_GROUP:      recipevault-dev-rg
  APP_SERVICE_NAME:    recipevault-api-dev

jobs:
  # ── Job 1: Aplicar Terraform ────────────────────────────────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    outputs:
      app_url: ${{ steps.get_url.outputs.url }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform-appservice
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform-appservice
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform-appservice
        run: terraform apply -auto-approve -no-color

      - name: Obtener URL de la app
        id: get_url
        working-directory: terraform-appservice
        run: |
          URL=$(terraform output -raw backend_url)
          echo "url=$URL" >> $GITHUB_OUTPUT

  # ── Job 2: Desplegar código de la app ───────────────────────────────────────
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: terraform   # Solo se ejecuta si terraform ha terminado bien

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Crear ZIP del código
        run: |
          cd app
          zip -r ../deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "venv/*" \
            --exclude "*.json"   # los JSON de datos los gestiona Blob Storage

      - name: Subir código a App Service
        run: |
          az webapp deployment source config-zip \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE_NAME }} \
            --src deploy.zip

      - name: Reiniciar App Service
        run: |
          az webapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE_NAME }}

      - name: Verificar que la app responde
        run: |
          URL="${{ needs.terraform.outputs.app_url }}"
          echo "Comprobando $URL ..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ App respondiendo correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i: HTTP $STATUS. Esperando 15s..."
            sleep 15
          done
          echo "❌ La app no respondió tras 10 intentos"
          exit 1

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "### 🚀 Despliegue completado" >> $GITHUB_STEP_SUMMARY
          echo "- **App Service:** ${{ env.APP_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.terraform.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
