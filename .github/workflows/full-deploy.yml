name: Full Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  infrastructure:
    name: 1 · Terraform Apply
    uses: ./.github/workflows/infrastructure.yml
    secrets: inherit
    with:
      action: apply

  tests:
    name: 2 · Tests
    needs: infrastructure
    uses: ./.github/workflows/tests.yml

  deploy-backend:
    name: 3 · Deploy
    needs: tests
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
