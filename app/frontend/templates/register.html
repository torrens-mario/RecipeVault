<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - RecipeVault</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body auth-body">
  <div class="auth-card">
    <div class="auth-logo">RecipeVault</div>
    <h1 class="auth-title">Crear cuenta</h1>
    <form id="registerForm" class="auth-form">
      <label>Nombre de usuario
        <input type="text" id="username" required autocomplete="username" minlength="3">
      </label>
      <label>Email
        <input type="email" id="email" required autocomplete="email">
      </label>
      <label>Contraseña
        <input type="password" id="password" required autocomplete="new-password" minlength="8">
      </label>
      <p id="registerError" class="auth-error" style="display:none"></p>
      <button type="submit" class="btn primary full-width">Registrarme</button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
  </div>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/';

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('registerError');
      err.style.display = 'none';
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      if (!res.ok) {
        const data = await res.json();
        err.textContent = data.detail || 'Error al registrarse';
        err.style.display = 'block';
        return;
      }
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('user_id', data.user_id);
      window.location.href = '/';
    });
  </script>
</body>
</html>
