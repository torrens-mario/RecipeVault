<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - RecipeVault</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="logo">RecipeVault</div>
    <nav class="nav-links">
      <a href="/">🍽 <span>Mis recetas</span></a>
      <a href="/inventory" class="active">🥫 <span>Inventario</span></a>
      <a href="/shopping-list">🛒 <span>Lista de la compra</span><span id="shoppingBadge" class="nav-badge" style="display:none">0</span></a><a href="/recipes/new">＋ <span>Nueva receta</span></a>
    </nav>
  </header>
  <main class="container">
    <section class="inventory-header">
      <div>
        <h1>Inventario de ingredientes</h1>
        <p class="muted">Controla qué tienes en la despensa y cuánto te queda.</p>
      </div>
      <form id="inventoryForm" class="inventory-form">
        <input name="name" placeholder="Ingrediente" required>
        <input name="quantity" type="number" step="0.1" min="0" placeholder="Cantidad" required>
        <select name="unit" required><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="cda">cda</option><option value="cdita">cdita</option><option value="uds">uds</option></select>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><select name="low_stock_threshold" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><select name="low_stock_unit" required><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="cda">cda</option><option value="cdita">cdita</option><option value="uds">uds</option></select></div>
        <button type="submit" class="btn primary">+ Añadir</button>
      </form>
    </section>
    <section>
      <table class="inventory-table">
        <thead><tr><th>Ingrediente</th><th>Cantidad</th><th>Unidad</th><th>Aviso mínimo</th><th></th></tr></thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </section>
  </main>

  <div id="editModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="editModalTitle">Editar ingrediente</div>
          <p class="muted">Actualiza la cantidad, unidad y aviso mínimo del ingrediente.</p>
        </div>
        <button type="button" class="modal-close" id="closeEditModal" aria-label="Cerrar">✕</button>
      </div>
      <form id="editInventoryForm">
        <input type="hidden" name="id">
        <div class="modal-grid">
          <div class="field">
            <label for="editName">Ingrediente</label>
            <input id="editName" name="name" required>
          </div>
          <div class="field">
            <label for="editQuantity">Cantidad</label>
            <input id="editQuantity" name="quantity" type="number" step="0.1" min="0" required>
          </div>
          <div class="field">
            <label for="editUnit">Unidad</label>
            <select id="editUnit" name="unit" required><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="cda">cda</option><option value="cdita">cdita</option><option value="uds">uds</option></select>
          </div>
          <div class="field">
            <label for="editThreshold">Aviso mínimo</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <select id="editThreshold" name="low_stock_threshold" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
              <select id="editThresholdUnit" name="low_stock_unit" required><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="cda">cda</option><option value="cdita">cdita</option><option value="uds">uds</option></select>
            </div>
          </div>
        </div>
        <div class="modal-actions" style="margin-top:16px;">
          <button type="button" class="btn secondary" id="cancelEditModal">Cancelar</button>
          <button type="submit" class="btn primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/inventory.js"></script>
<script src="/static/js/nav-badge.js"></script></body>
</html>
