<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeVault</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="logo">RecipeVault</div>
    <nav class="nav-links">
      <a href="/" class="active">🍽 <span>Mis recetas</span></a>
      <a href="/inventory">🥫 <span>Inventario</span></a>
      <a href="/shopping-list">🛒 <span>Lista de la compra</span><span id="shoppingBadge" class="nav-badge" style="display:none">0</span></a>
      <a href="/recipes/new">＋ <span>Nueva receta</span></a>
      <a href="#" onclick="logout();return false;" class="nav-logout">👤 <span id="navUser"></span></a>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <div>
        <h1>Tus recetas, tu despensa</h1>
        <p class="muted">Guarda tus platos favoritos y planifica qué quieres cocinar.</p>
      </div>
      <div class="hero-actions">
        <input id="search" type="search" placeholder="Buscar por nombre o descripción...">
        <select id="sortSelect" class="sort-select">
          <option value="alphabetical">Orden alfabético</option>
          <option value="favorites">Favoritas primero</option>
          <option value="ingredients">Más ingredientes</option>
          <option value="planned">Quiero cocinar primero</option>
        </select>
        <a class="btn primary" href="/recipes/new">+ Añadir receta</a>
      </div>
    </section>
    <section>
      <h2 class="section-title">🍽 <span>Mis recetas</span></h2>
      <div id="recipes" class="grid"></div>
    </section>
  </main>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/nav-badge.js"></script>
</body>
</html>
