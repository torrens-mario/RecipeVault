{% extends "base.html" %}
{% block title %}RecipeVault{% endblock %}
{% block content %}
    <section class="hero">
      <div>
        <h1>Tus recetas, tu despensa</h1>
        <p class="muted">Guarda tus platos favoritos y planifica qué quieres cocinar.</p>
      </div>
      <div class="hero-actions">
        <input id="search" type="search" placeholder="Buscar por nombre o descripción..." maxlength="200">
        <select id="sortSelect" class="sort-select">
          <option value="alphabetical">Orden alfabético</option>
          <option value="favorites">Favoritas primero</option>
          <option value="ingredients">Más ingredientes</option>
          <option value="planned">Quiero cocinar primero</option>
          <option value="rating">Mejor valoradas</option>
        </select>
        <a class="btn primary" href="/recipes/new">+ Añadir receta</a>
      </div>
    </section>
    <section>
      <div class="filter-bar">
        <select id="filterCategory" class="filter-select">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filterDifficulty" class="filter-select">
          <option value="">Todas las dificultades</option>
          <option value="Fácil">Fácil</option>
          <option value="Media">Media</option>
          <option value="Difícil">Difícil</option>
        </select>
        <button id="filterFavs" class="filter-btn" data-active="false">❤ Favoritas</button>
        <button id="filterPlan" class="filter-btn" data-active="false">📅 Quiero cocinar</button>
      </div>
      <h2 class="section-title">🍽 <span>Mis recetas</span></h2>
      <div id="recipes" class="grid"></div>
    </section>
{% endblock %}
{% block scripts %}
  <script src="/static/js/app.js"></script>
{% endblock %}
