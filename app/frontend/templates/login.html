<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - RecipeVault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽</text></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body auth-body">
  <div class="auth-card">
    <div class="auth-logo">RecipeVault</div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <form id="loginForm" class="auth-form">
      <label>Email
        <input type="email" id="email" required autocomplete="email">
      </label>
      <label>Contraseña
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <p id="loginError" class="auth-error" style="display:none"></p>
      <button type="submit" class="btn primary full-width">Entrar</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a href="/register">Regístrate</a></p>
  </div>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      if (!res.ok) {
        const data = await res.json();
        err.textContent = data.detail || 'Error al iniciar sesión';
        err.style.display = 'block';
        return;
      }
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('user_id', data.user_id);
      window.location.href = '/';
    });
  </script>
</body>
</html>
