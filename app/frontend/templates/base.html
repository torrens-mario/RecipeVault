<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RecipeVault{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="logo">RecipeVault</div>
    <nav class="nav-links">
      <a href="/"{% if active_page == 'recipes' %} class="active"{% endif %}>🍽 <span>Mis recetas</span></a>
      <a href="/inventory"{% if active_page == 'inventory' %} class="active"{% endif %}>🥫 <span>Inventario</span></a>
      <a href="/shopping-list"{% if active_page == 'shopping' %} class="active"{% endif %}>🛒 <span>Lista de la compra</span><span id="shoppingBadge" class="nav-badge" style="display:none">0</span></a>
      <a href="/recipes/new"{% if active_page == 'new_recipe' %} class="active"{% endif %}>＋ <span>Nueva receta</span></a>
      <a href="#" onclick="logout();return false;" class="nav-logout">👤 <span id="navUser"></span></a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  {% block scripts %}{% endblock %}
  <script src="/static/js/nav-badge.js"></script>
</body>
</html>
