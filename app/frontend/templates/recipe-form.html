<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receta - RecipeVault</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="logo">RecipeVault</div>
    <nav class="nav-links">
      <a href="/">🍽 <span>Mis recetas</span></a>
      <a href="/inventory">🥫 <span>Inventario</span></a>
      <a href="/shopping-list">🛒 <span>Lista de la compra</span><span id="shoppingBadge" class="nav-badge" style="display:none">0</span></a>
      <a href="/recipes/new" class="active">＋ <span>Nueva receta</span></a>
    </nav>
  </header>
  <main class="container">
    <section class="page-hero compact">
      <h1 id="formTitle">＋ <span>Nueva receta</span></h1>
      <p class="muted">Rellena los campos para guardar tu receta.</p>
    </section>
    <form id="recipeForm" class="form card form-card">
      <input name="title" placeholder="Título" required>
      <textarea name="description" placeholder="Descripción"></textarea>
      <input name="category" placeholder="Categoría" value="General">
      <input name="servings" type="number" value="2" min="1" max="20">
      <textarea name="ingredients" placeholder="Ingredientes, uno por línea. Ej: 4 uds Huevos o 3 cda Pesto"></textarea>
      <textarea name="steps" placeholder="Pasos, uno por línea"></textarea>
      <input name="tags" placeholder="Tags separadas por coma">
      <button type="submit" class="btn primary" id="submitBtn">Guardar receta</button>
    </form>
  </main>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  {% if edit_recipe_id is defined %}
  <script>
    window.EDIT_RECIPE_ID = {{ edit_recipe_id }};
    document.getElementById('formTitle').innerHTML = '✏️ <span>Editar receta</span>';
    document.getElementById('submitBtn').textContent = 'Guardar cambios';
  </script>
  {% endif %}
  <script src="/static/js/form.js"></script>
  <script src="/static/js/nav-badge.js"></script>
</body>
</html>
